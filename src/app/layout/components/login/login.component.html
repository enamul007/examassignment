<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div
            style="border-radius: 0x; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Welcome to
                        {{systemname()}}</div>
                    <span class="text-muted-color font-medium">Sign in to continue</span>
                </div>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                    <div>
                        <label for="user"
                            class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">User</label>
                        <input pInputText id="user" type="text" placeholder="put UserId"
                            class="w-full md:w-120 mb-8" formControlName="username" />
                        @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
                        <small style="color: red;">username is required.</small>
                        }
                        <label for="password1"
                            class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Password</label>
                        <p-password id="password1" formControlName="password" placeholder="password" [toggleMask]="true"
                            fluid [fluid]="true" [feedback]="false"></p-password>
                        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
                        <small style="color: red;">Password must be at least 6 characters.</small>
                        }
                        <div class="flex items-center justify-between mt-2 mb-8 gap-8">
                            <div class="flex items-center">
                                <p-checkbox formControlName="rememberMe" id="rememberMe" binary
                                    class="mr-2"></p-checkbox>
                                <label for="rememberMe">Remember me</label>
                            </div>
                            <span class="font-medium no-underline ml-2 text-right cursor-pointer text-primary">Forgot
                                password?</span>
                        </div>
                        <p-button label="Sign In" type="submit" [disabled]="loginForm.invalid">Login</p-button> 
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
